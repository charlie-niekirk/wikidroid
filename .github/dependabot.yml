version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Reads gradle/libs.versions.toml. Several versions there are deliberate pre-releases (see
  # "Version policy" in CLAUDE.md), so review its suggestions rather than merging them blindly.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
  # Moves the pinned cubiomes commit. Review the diff and re-run the golden tests before merging.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
