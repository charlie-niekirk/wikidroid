org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 9.5 only creates unit-test variants for debug by default, but Android Studio's sync still creates
# a Compose Preview task per variant and fails on release ("Unit tests are disabled for this variant").
android.onlyEnableUnitTestForTheTestedBuildType=false
